services:
  postgres:
    image: postgres:16-alpine
    container_name: ruby-veterinary-postgres
    environment:
      POSTGRES_USER: ruby
      POSTGRES_PASSWORD: ruby_dev
      POSTGRES_DB: ruby_veterinary_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruby -d ruby_veterinary_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
